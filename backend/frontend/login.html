<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | RecoverAI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-logo">

            <div class="logo-mark">
                R
            </div>

            <div>
                <h1>RecoverAI</h1>
                <span>Payment Recovery</span>
            </div>

        </div>


        <div class="login-header">

            <h2>Sign in</h2>

            <p>
                Access your revenue recovery dashboard.
            </p>

        </div>


        <form id="login-form">

            <div class="login-field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="login-field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <div
                id="login-error"
                class="login-error"
            ></div>


            <button
                type="submit"
                class="login-button"
            >
                Sign in
            </button>

        </form>


        <div class="login-footer">

            <span class="status-dot"></span>

            RecoverAI system operational

        </div>

    </div>

</div>


<script src="login.js"></script>

</body>

</html>
